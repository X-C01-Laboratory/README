<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今晚的约定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Ma+Shan+Zheng&family=Courier+Prime&display=swap">
<style>
  /* 日常聊天软件的观感：浅灰底、白色和绿色气泡。单一浅色主题。 */
  :root {
    color-scheme: light;
    --page: #d9d9d9;
    --bg: #ededed;
    --bar: #ededed;
    --line: #d6d6d6;
    --in: #ffffff;
    --out: #95ec69;
    --text: #191919;
    --muted: #8a8a8a;
    --link: #576b95;
    --paper: #f4efe2;
    --ink: #2b2620;
    --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-hand: "Ma Shan Zheng", "STKaiti", "KaiTi", cursive;
    --font-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font-family: var(--font); font-size: 16px; line-height: 1.55;
    display: flex; justify-content: center;
  }
  .app {
    position: relative; width: 100%; max-width: 460px; height: 100%;
    display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
    box-shadow: 0 0 0 1px #cfcfcf;
  }
  .bar {
    flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    background: var(--bar); border-bottom: 1px solid var(--line); padding: 8px 6px;
  }
  .who { text-align: center; line-height: 1.3; min-width: 0; }
  .who b { display: block; font-weight: 500; font-size: 17px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 11px; color: var(--muted); min-height: 1.3em; display: block; }
  .who span.typing { color: var(--link); }
  .iconbtn { width: 40px; height: 36px; display: grid; place-items: center; background: none; border: 0; color: var(--text); cursor: pointer; border-radius: 6px; }
  .iconbtn:hover { background: #dfdfdf; }
  .iconbtn svg { width: 22px; height: 22px; }
  :focus-visible { outline: 2px solid #07c160; outline-offset: 2px; }

  .menu { position: absolute; right: 8px; top: 54px; z-index: 5; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; min-width: 190px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .menu[hidden] { display: none; }
  .menu button { text-align: left; background: none; border: 0; color: var(--text); font: inherit; font-size: 15px; padding: 9px 12px; border-radius: 4px; cursor: pointer; }
  .menu button:hover { background: #f0f0f0; }
  .menu button.danger { color: #d13b3b; }

  .msgs { flex: 1; overflow-y: auto; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); text-align: center; max-width: 85%; background: #dadada; padding: 1px 8px; border-radius: 3px; color: #7a7a7a; }
  .sys.red { color: #a44; background: transparent; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.me { flex-direction: row-reverse; }
  .ava {
    flex: none; width: 40px; height: 40px; border-radius: 5px; display: grid; place-items: center;
    font-size: 17px; color: #fff; user-select: none;
  }
  .ava.lin { background: linear-gradient(160deg, #d98a9c, #b25a73); }
  .ava.me  { background: linear-gradient(160deg, #6f8fb3, #46617f); }
  .bubble {
    position: relative; max-width: min(72%, 300px); padding: 9px 12px; border-radius: 5px;
    background: var(--in); color: var(--text); word-break: break-word; white-space: pre-wrap;
  }
  .bubble::before { content: ""; position: absolute; top: 14px; left: -5px; border: 5px solid transparent; border-left: 0; border-right-color: var(--in); }
  .me .bubble { background: var(--out); }
  .me .bubble::before { left: auto; right: -5px; border: 5px solid transparent; border-right: 0; border-left-color: var(--out); }
  .bubble.big { font-family: var(--font-mono); font-size: 24px; letter-spacing: .25em; }
  .bubble.mirror span { display: inline-block; transform: scaleX(-1); }
  .bubble.card { padding: 6px; max-width: min(78%, 300px); white-space: normal; }
  .bubble.card::before { display: none; }
  .cap { font-size: 11px; color: var(--muted); padding: 4px 2px 0; }
  .appear { animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }

  .photo-log { background: var(--paper); color: var(--ink); padding: 12px 12px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; border-radius: 3px; }
  .photo-log h4 { margin: 0 0 6px; font-family: var(--font); font-size: 14px; text-align: center; letter-spacing: .3em; }
  .photo-log div { display: grid; grid-template-columns: 4.6em 1fr; gap: 6px; }
  .photo-log time { color: #7a705f; }
  .redact { background: var(--ink); color: var(--ink); }
  .ghost { color: var(--paper); }
  .ghost::selection { background: #07c160; color: #fff; }
  .video { position: relative; background: #111; height: 170px; border-radius: 3px; display: grid; place-items: center; overflow: hidden; }
  .video .ts { position: absolute; right: 8px; bottom: 6px; font-family: var(--font-mono); font-size: 11px; color: #bdbdbd; }
  .video .rec { position: absolute; left: 8px; top: 6px; font-family: var(--font-mono); font-size: 11px; color: #f66; }
  .lamp { width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4a3f38, #1d1815 70%); }
  .lamp.on { background: radial-gradient(circle at 40% 35%, #fff7d6, #f5c46a 55%, #c9822d); box-shadow: 0 0 26px 8px rgba(245,196,106,.6), 0 0 80px 30px rgba(245,196,106,.2); }
  .dark { position: relative; height: 260px; background: #cfc4ad; overflow: hidden; border-radius: 3px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .dark i { position: absolute; font-style: normal; font-family: var(--font-hand); color: #6a2230; white-space: nowrap; }
  .dark .shade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--x, -200px) var(--y, -200px), transparent 0 36px, rgba(6,6,6,.985) 74px); }
  .dark .tip { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #555; z-index: 1; pointer-events: none; }
  .file { background: var(--paper); color: var(--ink); padding: 12px; border-radius: 3px; font-family: var(--font-mono); font-size: 12.5px; }
  .file h4 { margin: 0 0 6px; font-family: var(--font); font-size: 14px; text-align: center; letter-spacing: .3em; }
  .file div { display: grid; grid-template-columns: 4.8em 1fr; gap: 6px; }
  .file b { font-weight: 700; }

  .chips { flex: none; display: flex; gap: 8px; padding: 6px 14px 0; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 13px; background: #fff; color: #576b95; border: 1px solid #d6d6d6; border-radius: 14px; padding: 4px 12px; cursor: pointer; }
  .chip:hover { background: #f5f5f5; }
  form.input { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bar); border-top: 1px solid var(--line); margin-top: 6px; }
  form.input input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: #fff; border: 0; border-radius: 5px; padding: 8px 10px; }
  form.input input:disabled { opacity: .6; }
  .send { font: inherit; font-size: 14px; background: #07c160; color: #fff; border: 0; border-radius: 5px; padding: 8px 14px; cursor: pointer; }
  .send:disabled { background: #a8dcc0; color: #f2fbf6; cursor: default; }

  .ending-words { font-family: var(--font-hand); font-size: 30px; color: #b0435c; align-self: center; text-align: center; line-height: 1.5; padding-block: 8px; }
  @media (prefers-reduced-motion: reduce) { .appear { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <span aria-hidden="true"></span>
    <div class="who"><b id="name">苏晚</b><span id="status"></span></div>
    <button class="iconbtn" type="button" id="menu-btn" aria-label="聊天设置" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>
  <div class="menu" id="menu" hidden>
    <button type="button" id="sound-btn">提示音：开</button>
    <button type="button" id="restart-btn" class="danger">清空聊天记录，重新开始</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="input" id="form" autocomplete="off">
    <input id="text" type="text" spellcheck="false" placeholder="发消息" aria-label="输入消息">
    <button class="send" id="send" type="submit">发送</button>
  </form>
  </div>

<script>
(function () {
  // 口令只存散列值，翻源码也拿不到答案。
  function hash(s) { var x = 0x811c9dc5; for (var ch of s) { x ^= ch.codePointAt(0); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16); }
  function norm(s) { return s.trim().toLowerCase().replace(/[\s\-_·.。，,、!！?？'"“”]/g, ""); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var STAGES = {
    1: { ans: ["ca8f2015"], near: {}, hints: ["我发的那四句话，看看每一句是怎么开头的。", "把四句话的第一个字连起来读。"] },
    2: { ans: ["6523e4dc"], near: {}, hints: ["第三条没有被划掉，只是字和纸是同一个颜色。", "用手指长按那一行，或者用鼠标拖过去选中它。"] },
    3: { ans: ["1324aa7c"], near: { "cb36196c": "不是求救。它在说一个包间号，两个字符。" }, hints: ["是摩尔斯电码。第一个字符：短、长。", "第二个字符：长、长、长、短、短。A 是 .-，8 是 ---.." ] },
    4: { ans: ["e46b4575", "57c408f5"], near: {}, hints: ["每个字母在字母表里往回数四个。X 就变成 T。", "X→T，V→R，Y→U，W→S。是一个英文单词，写中文也行。"] },
    5: { ans: ["8ec890ec"], near: { "28391241": "只要月和日，四个数字。" }, hints: ["字是反的，倒过来读。它问的是我们哪天结的婚。", "你可以翻翻我们的聊天，我们的结婚纪念日一直在置顶里。"] },
    6: { ans: ["6159fd3f"], near: {}, hints: ["字都写在墙上。四个角落都照一照。", "最大的那几个字在最下面。"] },
    7: { ans: ["f79356b3", "14a6babc", "9ac012e4", "1bd15669", "e55f99bf", "afe052a8"], near: { "7af6f6ee": "这是那个名字。我问的是，谁用它订的位。", "3b3234ec": "不是我。订位单上的付款账户，你再看一眼。" }, hints: ["订位单上写着付款账户。", "是你。回答你自己的名字，或者“我”。"] }
  };

  function L(x) { return { f: "lin", x: x }; }
  function S(x, red) { return { f: "sys", x: x, red: !!red }; }
  var SCRIPTS = {
    s1: [
      S("周四 19:47"),
      L("你回我一下"),
      L("我现在在外面，一会儿再跟你说细节"),
      L("你说想试试的那件事，我还是来了"),
      L("接下来的四句话，你别漏看"),
      L("今天他约我吃饭，我答应了"),
      L("晚上八点，就在我们以前常去的那家"),
      L("回来之前，我想先问你一句"),
      L("家里抽屉里那份约定，你还记得内容吗"),
      L("我今晚想告诉你的话，就藏在里面。你打给我")
    ],
    ok1: [L("对"), L("我想回家，可我要先弄清楚一件事"), { a: "pause", ms: 1200 }, L("你先别问，配合我")],
    s2: [
      L("这是那份约定，我出门前从抽屉里拍的"),
      { f: "lin", card: "log" },
      L("有一条被我涂白了，你记不记得"),
      { a: "recall", x: "我发错了一句" },
      L("暗号是什么？")
    ],
    ok2: [L("桂花"), L("你还记得"), L("那是我们婚礼上的花"), L("我现在过去，你等我消息")],
    s3: [
      S("20:12"),
      L("餐厅门口的招牌灯坏了，一闪一闪的"),
      { f: "lin", card: "lamp" },
      L("服务员说，它是包间的提示灯，短的是点，长的是划"),
      L("它在说几号包间？")
    ],
    ok3: [
      L("A8"),
      L("对，就是这间"),
      { a: "pause", ms: 1400 },
      L("门开着，里面只有一张两人桌"),
      L("桌上放着一张餐巾纸")
    ],
    s4: [
      S("20:19"),
      L("餐巾纸上有人用笔写了一串字母"),
      { f: "lin", big: "XVYWX" },
      L("下面还有一行小字：每个字母，都向后退四步"),
      L("写的是什么？")
    ],
    ok4: [L("信任"), L("这个词，我认得字迹"), { a: "pause", ms: 1000 }, L("我先去一趟洗手间，我得冷静一下")],
    s5: [
      L("洗手间的镜子上贴着一张便签"),
      L("字是反的，我拍给你"),
      { f: "lin", mirror: "你说想试试。\n我说好。\n可你还记得吗，\n我们是哪一天结的婚？\n月和日，四个数字。" },
      L("是写给我的吗")
    ],
    ok5: [L("0520"), L("你还记得"), L("我以为你早就忘了"), { a: "pause", ms: 1000 }, L("整层楼忽然停电了")],
    s6: [
      S("20:36"),
      L("走廊全黑了"),
      L("手机的手电只能照亮一小块"),
      { f: "lin", card: "dark" },
      L("墙上是客人们的留言"),
      L("有一句好像是写给我的"),
      L("你帮我找找，它让我去哪？")
    ],
    ok6: [
      L("露台上只有一张桌子，一支蜡烛"),
      L("桌上压着一张订位单"),
      { f: "lin", card: "file" },
      L("订位人是陈铭，我根本不认识这个人"),
      L("备注写着：两人位，请勿打扰"),
      L("付款账户……"),
      L("你看一眼。陈铭到底是谁？")
    ],
    s7: [],
    end: [
      L("对"),
      L("是你"),
      { a: "pause", ms: 1400 },
      L("三个月前你说想试试，我答应了"),
      L("我怕你觉得我不够开放，其实我从来没想过"),
      L("暗号我一直没用，是想等你自己喊停"),
      L("可你订了位，用了别人的名字，坐在别处看着我"),
      L("你现在在哪？"),
      { a: "pause", ms: 1400 },
      S("20:47"),
      { f: "me", x: "我在露台对面。我不想再试了，对不起" },
      L("我看见你了"),
      L("回家吧"),
      { a: "done" }
    ]
  };
  var WRONG = ["不对", "不是这个", "你再想想", "你是不是没在认真看", "不对……"];
  var IDLE = ["还在吗", "你怎么不说话", "我听到你那边有声音"];

  // 状态
  var KEY = "xc01-chat-v3";
  function fresh() { return { stage: 1, hist: [], q: null, hints: {}, idle: {}, ui: { name: "苏晚", status: "", twisted: false }, done: false }; }
  var st = fresh();
  try { var sv = JSON.parse(localStorage.getItem(KEY) || "null"); if (sv && sv.hist) st = sv; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var app = document.getElementById("app"), msgs = document.getElementById("msgs"), chips = document.getElementById("chips");
  var form = document.getElementById("form"), input = document.getElementById("text"), sendBtn = document.getElementById("send");
  var nameEl = document.getElementById("name"), statusEl = document.getElementById("status");
  var busy = false, idleTimer = null, ghostTimer = null, epoch = 0;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 重新开始时 epoch 自增，旧的等待会被拒绝，正在播放的脚本随之中止
  function wait(ms) { var my = epoch; return new Promise(function (r, j) { setTimeout(function () { my === epoch ? r() : j("reset"); }, ms); }); }

  // 提示音（首次操作之后才会响）
  var ac = null, soundOn = true;
  try { soundOn = localStorage.getItem(KEY + "-sound") !== "off"; } catch (e) {}
  function blip(low) {
    if (!soundOn) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = "sine";
      o.frequency.setValueAtTime(low ? 90 : 880, t); o.frequency.exponentialRampToValueAtTime(low ? 40 : 620, t + (low ? .5 : .09));
      g.gain.setValueAtTime(low ? .08 : .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + (low ? .55 : .12));
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .6);
    } catch (e) {}
  }

  function applyUI() {
    nameEl.textContent = st.ui.name;
    statusEl.textContent = st.ui.status; statusEl.className = "";
        input.placeholder = "发消息";
  }

  function card(kind) {
    if (kind === "log") return '<div class="photo-log"><h4>我们的约定</h4>' +
      '<div><time>第一条</time><span>双方自愿，任何一方随时可以说不。</span></div>' +
      '<div><time>第二条</time><span>对方是谁，必须让另一方知道。</span></div>' +
      '<div><time>第三条</time><span class="ghost">暗号是“桂花”。一说出口，一切立刻停止。</span></div>' +
      '<div><time>第四条</time><span>不许过夜，不许隐瞒，不许借此报复。</span></div>' +
      '<div><time>第五条</time><span>试过之后，谁都不许再提。</span></div>' +
      '<div><time>签名</time><span>周然　苏晚</span></div></div><div class="cap">照片 · 抽屉里的纸</div>';
    if (kind === "lamp") return '<div class="video" role="img" aria-label="视频：一盏在闪烁的灯"><span class="rec">● REC</span><div class="lamp"></div><span class="ts">00:13 循环</span></div><div class="cap">视频 · 餐厅门口</div>';
    if (kind === "dark") return '<div class="dark">' +
      '<i style="left:6%;top:8%;font-size:22px;transform:rotate(-7deg)">生日快乐</i>' +
      '<i style="left:60%;top:6%;font-size:15px">2016.5.20</i>' +
      '<i style="left:52%;top:36%;font-size:19px;transform:rotate(5deg)">别走</i>' +
      '<i style="left:8%;top:48%;font-size:16px">你先开口</i>' +
      '<i style="left:24%;top:74%;font-size:28px;transform:rotate(-3deg)">去 露台</i>' +
      '<i style="left:80%;top:80%;font-size:13px">A8</i>' +
      '<div class="shade"></div><span class="tip">在照片上移动鼠标或手指</span></div><div class="cap">照片 · 停电后的走廊</div>';
    if (kind === "file") return '<div class="file"><h4>订位单</h4>' +
      '<div><b>订位人</b><span>陈铭</span></div><div><b>时间</b><span>周四 20:00</span></div>' +
      '<div><b>位置</b><span>露台，两人位</span></div><div><b>备注</b><span>请勿打扰，蜡烛一支</span></div>' +
      '<div><b>付款</b><span>周然（手机尾号与常用号一致）</span></div></div><div class="cap">照片 · 订位单</div>';
    return "";
  }

  function render(m, animate) {
    var el = document.createElement("div");
    if (m.f === "sys") { el.className = "sys" + (m.red ? " red" : ""); el.textContent = m.x; }
    else if (m.f === "end") { el.className = "ending-words"; el.textContent = m.x; }
    else {
      el.className = "row " + (m.f === "me" ? "me" : "lin");
      var ava = '<div class="ava ' + (m.f === "me" ? "me" : "lin") + '" aria-hidden="true">' + (m.f === "me" ? "我" : "<span>晚</span>") + '</div>';
      var b;
      if (m.card) b = '<div class="bubble card">' + card(m.card) + '</div>';
      else if (m.big) b = '<div class="bubble big">' + esc(m.big) + '</div>';
      else if (m.mirror) b = '<div class="bubble mirror"><span>' + esc(m.mirror) + '</span></div>';
      else b = '<div class="bubble">' + esc(m.x) + '</div>';
      el.innerHTML = ava + b;
    }
    if (animate && !reduce) el.classList.add("appear");
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }
  function push(m) { st.hist.push(m); save(); return render(m, true); }

  function setTyping(on) {
    statusEl.textContent = on ? "对方正在输入…" : st.ui.status;
    statusEl.className = on ? "typing" : "";
  }
  async function linSays(m) {
    var len = (m.x || m.big || m.mirror || "").length;
    setTyping(true);
    await wait(m.card ? 1500 : Math.min(2300, 450 + len * 55));
    setTyping(false);
    push(m); blip();
  }

  async function perform(m) {
    if (m.a === "pause") return wait(m.ms);
    if (m.a === "recall") {
      setTyping(true); await wait(700); setTyping(false);
      var tmp = render({ f: "lin", x: m.x }, true); blip();
      await wait(1100);
      tmp.remove();
      push(S("「" + st.ui.name + "」撤回了一条消息"));
      return wait(500);
    }
    if (m.a === "fakeme") { await wait(300); push({ f: "me", x: m.x }); return; }
    if (m.a === "done") { st.done = true; save(); await wait(900); push({ f: "end", x: "今晚，我们回家。" }); return; }
    if (m.f === "sys") { await wait(350); push(m); return; }
    if (m.f === "me") { await wait(400); push(m); return; }
    return linSays(m);
  }

  function lock(on) { busy = on; input.disabled = on || st.done; sendBtn.disabled = on || st.done; renderChips(); }
  function renderChips() {
    chips.innerHTML = "";
    if (st.done) { addChip("重新开始", restart); return; }
    if (!busy) addChip("我看不懂", function () { send("我看不懂"); });
  }
  function addChip(label, fn) { var c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = label; c.onclick = fn; chips.appendChild(c); }

  // 按脚本逐条发消息；进度随时存档，刷新后从中断处继续
  function play(key) { st.q = { key: key, pos: 0 }; save(); return run(); }
  async function run() {
    clearTimers(); lock(true);
    try {
      var list = SCRIPTS[st.q.key];
      while (st.q.pos < list.length) { await perform(list[st.q.pos]); st.q.pos++; save(); }
    } catch (e) { if (e !== "reset") console.error(e); return; }
    var key = st.q.key; st.q = null; save();
    if (key.indexOf("ok") === 0) {
      var n = +key.slice(2); st.stage = n + 1; save();
      return play("s" + (n + 1));
    }
    lock(false);
    if (key === "end") return;
    armTimers();
    if (!(window.matchMedia && matchMedia("(pointer: coarse)").matches)) input.focus();
  }

  function clearTimers() { clearTimeout(idleTimer); clearTimeout(ghostTimer); }
  function armTimers() {
    clearTimers();
    var my = epoch, stage = st.stage;
    // 对方“正在输入”，却什么也没发
    ghostTimer = setTimeout(function () {
      if (busy || my !== epoch) return;
      setTyping(true); setTimeout(function () { if (!busy && my === epoch) setTyping(false); }, 2600);
    }, 22000);
    if (!st.idle[stage]) idleTimer = setTimeout(function () {
      if (busy || my !== epoch) return;
      st.idle[stage] = true; lock(true);
      linSays(L(IDLE[stage % IDLE.length])).then(function () { lock(false); }, function () {});
    }, 50000);
  }

  async function send(text) {
    if (busy || st.done || st.q) return;
    text = text.trim(); if (!text) return;
    clearTimers();
    push({ f: "me", x: text });
    var v = norm(text), stg = STAGES[st.stage], h = hash(v);
    lock(true);
    try {
      await wait(500);
      if (stg.ans.indexOf(h) !== -1) return play(st.stage < 7 ? "ok" + st.stage : "end");
      if (/^(提示|看不懂|我看不懂|不懂|帮帮我|help|hint)$/.test(v)) {
        var n = st.hints[st.stage] || 0;
        if (n < stg.hints.length) { st.hints[st.stage] = n + 1; save(); await linSays(L(stg.hints[n])); }
        else await linSays(L("我也只知道这么多了……"));
      } else if (stg.near[h]) {
        await linSays(L(stg.near[h]));
      } else {
        await linSays(L(WRONG[Math.floor(Math.random() * WRONG.length)]));
      }
    } catch (e) { return; }
    lock(false); armTimers();
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); var t = input.value; input.value = ""; send(t); });

  // 灯：A8 = .- ---..，单位 280ms，所有视频卡共用一个节拍
  (function lampLoop() {
    var U = 280, seq = [];
    function sym(code) { code.split("").forEach(function (c, i) { if (i) seq.push([0, 1]); seq.push([1, c === "-" ? 3 : 1]); }); }
    sym(".-"); seq.push([0, 3]); sym("---.."); seq.push([0, 9]);
    var i = 0;
    (function step() {
      var s = seq[i % seq.length]; i++;
      var lamps = document.querySelectorAll(".lamp");
      for (var k = 0; k < lamps.length; k++) lamps[k].classList.toggle("on", s[0] === 1);
      setTimeout(step, s[1] * U);
    })();
  })();

  // 暗室手电
  function torch(e) {
    var d = e.target.closest && e.target.closest(".dark"); if (!d) return;
    var r = d.getBoundingClientRect(), sh = d.querySelector(".shade");
    sh.style.setProperty("--x", (e.clientX - r.left) + "px"); sh.style.setProperty("--y", (e.clientY - r.top) + "px");
  }
  msgs.addEventListener("pointermove", torch);
  msgs.addEventListener("pointerdown", torch);

  // 菜单
  var menu = document.getElementById("menu"), menuBtn = document.getElementById("menu-btn");
  var soundBtn = document.getElementById("sound-btn"), restartBtn = document.getElementById("restart-btn"), armed = false;
  function setMenu(open) { menu.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); if (!open) { armed = false; restartBtn.textContent = "清空聊天记录，重新开始"; } }
  menuBtn.onclick = function (e) { e.stopPropagation(); setMenu(menu.hidden); };
  document.addEventListener("click", function (e) { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  soundBtn.textContent = "提示音：" + (soundOn ? "开" : "关");
  soundBtn.onclick = function () { soundOn = !soundOn; soundBtn.textContent = "提示音：" + (soundOn ? "开" : "关"); try { localStorage.setItem(KEY + "-sound", soundOn ? "on" : "off"); } catch (e) {} };
  restartBtn.onclick = function () {
    if (!armed) { armed = true; restartBtn.textContent = "再点一次：记录会全部消失"; return; }
    setMenu(false); restart();
  };

  function restart() {
    epoch++; clearTimers();
    st = fresh(); save();
    msgs.innerHTML = ""; applyUI(); setTyping(false);
    busy = false;
    play("s1");
  }

  // 启动：先还原聊天记录，再从中断的地方接着播
  applyUI();
  st.hist.forEach(function (m) { render(m, false); });
  if (st.q) run();
  else if (!st.hist.length) play("s1");
  else { lock(false); if (!st.done) armTimers(); }

  
})();
</script>
</body>
</html>
